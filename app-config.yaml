app:
  title: Homelab Backstage
  baseUrl: ${APP_BASE_URL}
  packages: all
  
  listen:
    port: 3000
    host: 0.0.0.0

organization:
  name: Homelab

backend:
  baseUrl: ${BACKEND_BASE_URL}
  listen:
    port: 7007
    host: 0.0.0.0
  csp:
    # Browser only talks to this origin; upstream services (incl. the webhook
    # backend) are reached through backend routes.
    connect-src: ["'self'"]
  cors:
    # Allow frontend calls from configured app/backend origins.
    origin:
      - ${APP_BASE_URL}
      - ${BACKEND_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  auth:
    keys:
      - secret: ${BACKEND_SECRET}
  database:
    client: better-sqlite3
    connection: ':memory:'
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder

proxy: {}

webhooks:
  # Upstream generic webhook backend. Only the Backstage backend calls it:
  #   /api/webhooks/<app>/<event>       -> <baseUrl>/api/webhooks/<tenant>/<app>/<event>
  #   /api/webhooks/operator/<id>/status -> <baseUrl>/api/operator/webhooks/<id>/status
  baseUrl: ${WEBHOOK_BASE_URL:-http://localhost:3001}
  # Tenant path segment; set explicitly per environment.
  tenant: ${WEBHOOK_TENANT:-backstage-production}
  timeoutMs: 30000
  # Optional HMAC-SHA256 signing secret shared with the webhook backend.
  # Upstream verifies x-backstage-signature over
  #   v1:<x-backstage-timestamp>:<METHOD>:<path?query>:<raw body>
  signingSecret: ${WEBHOOK_SIGNING_SECRET:-}

techdocs:
  builder: 'local'
  generator:
    runIn: 'docker'
  publisher:
    type: 'local'

auth:
  environment: production
  # Allow auth popup callback from both app and backend public origins.
  experimentalExtraAllowedOrigins:
    - ${APP_BASE_URL}
    - ${BACKEND_BASE_URL}
  session:
    secret: ${SESSION_SECRET}
  providers:
    # Keycloak OIDC — primary sign-in method
    oidc:
      production:
        metadataUrl: ${AUTH_OIDC_METADATA_URL}
        clientId: ${AUTH_OIDC_CLIENT_ID}
        clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
        # Reuse an existing Keycloak session instead of forcing a login prompt.
        prompt: auto
        signIn:
          resolvers:
            # Match the OIDC `sub` (Keycloak user ID) to the keycloak.org/id
            # annotation set by the keycloakOrg catalog provider.
            - resolver: keycloakIdMatchingUserEntityAnnotation
    # Force Keycloak sign-in in all environments.
    guest: null

scaffolder: {}

catalog:
  providers:
    keycloakOrg:
      default:
        baseUrl: ${KEYCLOAK_BASE_URL}
        loginRealm: ${KEYCLOAK_LOGIN_REALM}
        realm: ${KEYCLOAK_REALM}
        clientId: ${KEYCLOAK_CATALOG_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CATALOG_CLIENT_SECRET}
        schedule:
          frequency: { minutes: 5 }
          timeout: { minutes: 3 }
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, User, Group]
  # File targets resolve against the backend's working directory:
  # packages/backend under `yarn start`; container overlays override with ./examples.
  locations:
    - type: file
      target: ../../examples/templates/*/template.yaml
      rules:
        - allow: [Template]
    - type: url
      target: https://github.com/ryanshaut/homelab-backstage-assets/blob/main/catalog-info.yaml
      rules:
        - allow: [Location, Template]

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN_ASSETS}

permission:
  enabled: true
  # Groups allowed to run templates / scaffolder actions. Unset = everyone.
  # templateRunnerGroups:
  #   - group:default/platform-team

mcpActions:
  name: 'Homelab Backstage'
  description: 'Tools for managing the homelab software catalog'
