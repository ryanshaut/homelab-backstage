apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: noop-testing-webhook-template
  title: A noop-testing for testing
  description: Dispatch a generic webhook request using template-defined routing
spec:
  owner: group:platform-team
  type: automation

  parameters:
    - title: Approval
      properties:
        approvalId:
          title: Approval ID
          type: string
          ui:widget: hidden

  steps:
    - id: require-approval
      name: Request approval
      action: approval:dispatch
      input:
        approvalSubject: user::ryan@shaut.us
        summary: Run the noop-testing webhook workflow
        approvalId: ${{ parameters.approvalId }}
        values: ${{ parameters }}
        data:
          operation: noop-testing
          template: noop-testing-webhook-template

    - id: dispatch
      name: Dispatch Webhook
      if: ${{ steps['require-approval'].output.approved }}
      action: webhook:dispatch
      input:
        app: automation
        event: noop-testing
        method: POST
        headers:
          x-request-source: backstage-scaffolder
        query:
          version: v1
        body:
          operation: noop-testing

  output:
    links:
      - title: Approval Status
        url: ${{ steps['require-approval'].output.statusUrl }}
      - title: Webhook Endpoint
        url: ${{ steps['dispatch'].output.targetUrl }}
      - title: Request Resource URL
        url: ${{ steps['dispatch'].output.resourceUrl }}
      - title: Webhook Status (Backstage UI)
        url: /webhook-status?id=${{ steps['dispatch'].output.webhookId }}&statusUrl=${{ steps['dispatch'].output.statusUrl }}
      - title: Webhook Status Endpoint
        url: ${{ steps['dispatch'].output.statusUrl }}
    text:
      - title: Approval Result
        content: |
          Status: ${{ steps['require-approval'].output.status }}
          Approval ID: ${{ steps['require-approval'].output.approvalId }}
          Reason: ${{ steps['require-approval'].output.reason }}
      - title: Dispatch Result
        content: |
          Status: ${{ steps['dispatch'].output.status }}
          Webhook ID: ${{ steps['dispatch'].output.webhookId }}
          Response JSON:
          ${{ steps['dispatch'].output.responseJson }}
