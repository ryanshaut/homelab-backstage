# Local development overlay for `yarn start` (frontend :3000, backend :7007)

app:
  baseUrl: http://localhost:3000

backend:
  baseUrl: http://localhost:7007
  cors:
    origin:
      - http://localhost:3000

auth:
  environment: production
  experimentalExtraAllowedOrigins:
    - http://localhost:7007
    - http://localhost:3000
