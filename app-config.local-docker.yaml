# Single-origin local Docker overlay (production image on localhost:7007)
#
#   docker run ... -e APP_CONFIG_ARGS="--config app-config.yaml --config app-config.local-docker.yaml"

app:
  baseUrl: http://localhost:7007

backend:
  baseUrl: http://localhost:7007
  cors:
    origin:
      - http://localhost:7007

auth:
  environment: development
  experimentalExtraAllowedOrigins:
    - http://localhost:7007
  providers:
    # Same Keycloak client as production, keyed for auth.environment=development.
    oidc:
      development:
        metadataUrl: ${AUTH_OIDC_METADATA_URL}
        clientId: ${AUTH_OIDC_CLIENT_ID}
        clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
        prompt: auto
        signIn:
          resolvers:
            - resolver: keycloakIdMatchingUserEntityAnnotation

webhooks:
  tenant: ${WEBHOOK_TENANT:-backstage-development}

catalog:
  # Container working directory is /app.
  locations:
    - type: file
      target: ./examples/templates/*/template.yaml
      rules:
        - allow: [Template]
