# Local development stack for homelab-backstage
#
# Usage:
#   cp .env.example .env          # fill in real values
#   docker compose up -d          # start all services
#   docker compose logs -f        # tail logs
#   docker compose down -v        # stop and remove volumes
#
# Services:
#   postgres   — Backstage's database
#   keycloak   — Identity provider (create the `backstage` realm and clients
#                on first start; see .env.example for the client IDs)
#   backstage  — The Backstage app itself (built from Dockerfile.dev)


services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      POSTGRES_DB: ${POSTGRES_DB:-backstage}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backstage}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak ────────────────────────────────────────────────────────────────
  # Dev mode (no TLS) — imports the realm definition on first start.
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Backstage ───────────────────────────────────────────────────────────────
  backstage:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "7007:7007"
      - "3000:3000"
    environment:
      # Database (unused while app-config uses in-memory SQLite)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      POSTGRES_DB: ${POSTGRES_DB:-backstage}
      # Public URLs (app-config-local.yaml pins localhost:3000 / :7007)
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:7007}
      # Backstage secrets
      BACKEND_SECRET: ${BACKEND_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      # Keycloak OIDC (sign-in)
      AUTH_OIDC_METADATA_URL: http://keycloak:8080/realms/backstage/.well-known/openid-configuration
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-backstage}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET}
      # Keycloak catalog sync
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_LOGIN_REALM: ${KEYCLOAK_LOGIN_REALM:-master}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-backstage}
      KEYCLOAK_CATALOG_CLIENT_ID: ${KEYCLOAK_CATALOG_CLIENT_ID:-backstage-catalog-sync}
      KEYCLOAK_CATALOG_CLIENT_SECRET: ${KEYCLOAK_CATALOG_CLIENT_SECRET}
      # Generic webhook backend
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://host.docker.internal:3001}
      WEBHOOK_TENANT: ${WEBHOOK_TENANT:-}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      # External approval system (optional)
      APPROVALS_BASE_URL: ${APPROVALS_BASE_URL:-}
      APPROVALS_SOURCE: ${APPROVALS_SOURCE:-backstage}
      APPROVALS_CALLBACK_BASE_URL: ${APPROVALS_CALLBACK_BASE_URL:-}
      APPROVALS_SIGNING_SECRET: ${APPROVALS_SIGNING_SECRET:-}
      APPROVALS_OIDC_METADATA_URL: ${APPROVALS_OIDC_METADATA_URL:-}
      APPROVALS_CLIENT_ID: ${APPROVALS_CLIENT_ID:-}
      APPROVALS_CLIENT_SECRET: ${APPROVALS_CLIENT_SECRET:-}
      # GitHub token for the homelab-backstage-assets catalog location
      GITHUB_TOKEN_ASSETS: ${GITHUB_TOKEN_ASSETS:-}
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  postgres_data:
  keycloak_data:
